name: Maven All

on:
  workflow_dispatch:
    inputs:
      maven_args:
        description: "Extra Maven args (e.g. -DskipTests, -T 1C)"
        type: string
        default: ''
      include_applications:
        description: "Include application repos"
        type: boolean
        default: true

jobs:
  build:
    name: Maven Reactor Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Clone repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INCLUDE_APPLICATIONS: ${{ inputs.include_applications }}
        run: |
          declare -A REPO_OVERRIDE=([pages]="casehubio/casehub-pages" [worker]="casehubio/casehub-worker" [desiredstate]="casehubio/casehub-desiredstate" [ras]="casehubio/casehub-ras" [ops]="casehubio/casehub-ops" [flow]="mdproctor/flow")
          declare -A TOKEN_OVERRIDE=([quarkmind]="$GH_TOKEN" [flow]="$GH_TOKEN")
          clone_csv() {
            local csv=$1
            while IFS=',' read -r name _rest; do
              [[ "$name" =~ ^#|^$ ]] && continue
              local token="${TOKEN_OVERRIDE[$name]:-$GITHUB_TOKEN}"
              local repo="${REPO_OVERRIDE[$name]:-casehubio/$name}"
              git clone "https://x-access-token:${token}@github.com/${repo}.git" "../$name"
            done < "$csv"
          }
          clone_csv build/modules-core.csv
          if [ "$INCLUDE_APPLICATIONS" = "true" ]; then clone_csv build/modules-applications.csv; fi

      - name: Install parent POM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -N --batch-mode -q

      - name: Maven reactor build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -fae -f aggregator.xml --batch-mode ${{ inputs.maven_args }}

      - name: Sync casehub-all
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INCLUDE_APPLICATIONS: ${{ inputs.include_applications }}
          TRIGGER: ${{ github.event_name }}
        run: python3 scripts/sync-casehub-all.py

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Args: \`${{ inputs.maven_args || 'none' }}\` | Apps: ${{ inputs.include_applications }}_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed.**"
            else
              echo "❌ **Reactor build failed.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
