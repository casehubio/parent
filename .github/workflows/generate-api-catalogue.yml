name: Generate API catalogue

on:
  push:
    branches: [main]
    paths:
      - 'docs/repos/*/api/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Check out peer repos for source scanning
        run: |
          mkdir -p /tmp/repos
          for repo in engine blocks work platform neocortex eidos ledger qhorus worker ras desiredstate connectors ops iot; do
            git clone --quiet --depth=1 "https://x-access-token:${{ secrets.GH_PAT }}@github.com/casehubio/$repo.git" "/tmp/repos/$repo" 2>/dev/null || echo "SKIP $repo: clone failed"
          done

      - name: Generate cross-repo overlay
        run: |
          python3 scripts/api-catalogue/generate_overlay.py . /tmp/repos/*

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/api/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/
          git commit -m "docs(#402): regenerate API catalogue [skip ci]"
          git push
