<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="casehub-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="500" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Lifecycle Coverage Comparison</text>
  <text x="500" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B" font-style="italic">Only CaseHub covers all five lifecycle stages as one platform</text>

  <!-- ═══════════════ Stage Column Headers ═══════════════ -->

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <rect x="210" y="64" width="140" height="28" rx="6" fill="#FBBF24" opacity="0.8"/>
    <text x="280" y="82" fill="#1E293B">Declaration</text>

    <rect x="362" y="64" width="140" height="28" rx="6" fill="#60A5FA" opacity="0.8"/>
    <text x="432" y="82" fill="#1E293B">Intelligence</text>

    <rect x="514" y="64" width="140" height="28" rx="6" fill="#818CF8" opacity="0.8"/>
    <text x="584" y="82" fill="#FFFFFF">Control</text>

    <rect x="666" y="64" width="140" height="28" rx="6" fill="#2DD4BF" opacity="0.8"/>
    <text x="736" y="82" fill="#1E293B">Convergence</text>

    <rect x="818" y="64" width="140" height="28" rx="6" fill="#34D399" opacity="0.8"/>
    <text x="888" y="82" fill="#1E293B">Operations</text>
  </g>

  <!-- Vertical grid lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="350" y1="100" x2="350" y2="340"/>
    <line x1="502" y1="100" x2="502" y2="340"/>
    <line x1="654" y1="100" x2="654" y2="340"/>
    <line x1="806" y1="100" x2="806" y2="340"/>
  </g>

  <!-- ═══════════════ CaseHub Row ═══════════════ -->

  <text x="190" y="132" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">CaseHub</text>
  <rect x="210" y="108" width="748" height="48" rx="8" fill="url(#casehub-bar)" filter="url(#shadow)" opacity="0.9"/>
  <text x="584" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="white">All Five Stages — One Platform</text>

  <!-- ═══════════════ LangChain / CrewAI / AutoGen Row ═══════════════ -->

  <text x="190" y="192" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">LangChain / CrewAI</text>
  <text x="190" y="206" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#94A3B8">AutoGen</text>
  <!-- Gaps -->
  <rect x="210" y="176" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Filled -->
  <rect x="362" y="176" width="140" height="36" rx="5" fill="#60A5FA" opacity="0.5" filter="url(#shadow)"/>
  <text x="432" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E293B">Intelligence</text>
  <!-- Gaps -->
  <rect x="514" y="176" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="666" y="176" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="818" y="176" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ═══════════════ Camunda / jBPM Row ═══════════════ -->

  <text x="190" y="252" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">Camunda / jBPM</text>
  <!-- Gaps -->
  <rect x="210" y="236" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="362" y="236" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Filled -->
  <rect x="514" y="236" width="140" height="36" rx="5" fill="#818CF8" opacity="0.5" filter="url(#shadow)"/>
  <text x="584" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E293B">Control</text>
  <!-- Gaps -->
  <rect x="666" y="236" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="818" y="236" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ═══════════════ Kubernetes Row ═══════════════ -->

  <text x="190" y="312" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748B">Kubernetes</text>
  <!-- Gaps -->
  <rect x="210" y="296" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="362" y="296" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="514" y="296" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Filled -->
  <rect x="666" y="296" width="140" height="36" rx="5" fill="#2DD4BF" opacity="0.5" filter="url(#shadow)"/>
  <text x="736" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1E293B">Convergence</text>
  <!-- Gaps -->
  <rect x="818" y="296" width="140" height="36" rx="5" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ═══════════════ Bottom Annotation ═══════════════ -->

  <line x1="210" y1="350" x2="958" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <text x="500" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748B">
    Dashed boxes = lifecycle stages not covered by that platform
  </text>
  <text x="500" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0F172A" font-weight="bold">
    CaseHub: Declaration → Intelligence → Control → Convergence → Operations — with full accountability
  </text>
</svg>
